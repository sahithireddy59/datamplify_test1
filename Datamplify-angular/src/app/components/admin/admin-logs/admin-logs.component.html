<div class="admin-logs">
  <div class="logs-header">
    <div>
      <h2 class="page-title">Activity Logs</h2>
      <p class="page-subtitle">Monitor system and user activity</p>
    </div>
  </div>

  <div class="card">
    <div class="card-header">
      <div class="d-flex justify-content-between align-items-center">
        <h5 class="card-title mb-0">
          <i class="fa fa-history me-2"></i> System Logs
        </h5>
        <div class="d-flex gap-2">
          <select class="form-select form-select-sm" [(ngModel)]="selectedType" (change)="filterLogs()" style="width: 150px;">
            <option *ngFor="let type of logTypes" [value]="type.value">{{ type.label }}</option>
          </select>
          <input type="text" class="form-control form-control-sm" placeholder="Search logs..." [(ngModel)]="searchTerm" (input)="filterLogs()" style="width: 200px;">
        </div>
      </div>
    </div>
    <div class="card-body p-0">
      <div class="table-responsive">
        <table class="table table-hover mb-0">
          <thead>
            <tr>
              <th>Type</th>
              <th>User</th>
              <th>Action</th>
              <th>Details</th>
              <th>Timestamp</th>
              <th>Severity</th>
            </tr>
          </thead>
          <tbody>
            <tr *ngFor="let log of filteredLogs | paginate: { itemsPerPage: pageSize, currentPage: page }">
              <td>
                <i class="fa" [ngClass]="getTypeIcon(log.type)"></i>
                <span class="ms-2">{{ log.type }}</span>
              </td>
              <td>{{ log.user }}</td>
              <td><strong>{{ log.action }}</strong></td>
              <td>{{ log.details }}</td>
              <td>{{ log.timestamp | date:'short' }}</td>
              <td>
                <span class="badge" [ngClass]="getSeverityClass(log.severity)">
                  {{ log.severity }}
                </span>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
    <div class="card-footer">
      <pagination-controls (pageChange)="page = $event"></pagination-controls>
    </div>
  </div>
</div>
